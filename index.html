<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUMIÈRE — Product Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  /* ── RESET & TOKENS ────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0e0c;
    --surface:   #181714;
    --card:      #201e1a;
    --border:    #2e2b26;
    --gold:      #c9a84c;
    --gold-lt:   #e2c27a;
    --text:      #f0ebe2;
    --muted:     #7a7060;
    --danger:    #c0523a;
    --ff-serif:  'Cormorant Garamond', Georgia, serif;
    --ff-sans:   'DM Sans', sans-serif;
    --ease:      cubic-bezier(.4,0,.2,1);
    --radius:    6px;
    --cart-w:    420px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff-sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SCROLLBAR ─────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── HEADER ────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,14,12,.85);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
  }

  .logo {
    font-family: var(--ff-serif);
    font-size: 26px; font-weight: 300; letter-spacing: .25em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .logo span { font-style: italic; color: var(--gold-lt); }

  .header-right { display: flex; align-items: center; gap: 24px; }

  .cart-btn {
    position: relative;
    background: none; border: 1px solid var(--border);
    color: var(--text); cursor: pointer;
    padding: 8px 20px; border-radius: var(--radius);
    font-family: var(--ff-sans); font-size: 13px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
    transition: border-color .2s var(--ease), background .2s var(--ease);
  }
  .cart-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.07); }

  .cart-icon { font-size: 16px; }

  .cart-count {
    position: absolute; top: -8px; right: -8px;
    background: var(--gold); color: #0f0e0c;
    border-radius: 50%; width: 20px; height: 20px;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transform: scale(0); transition: transform .25s var(--ease);
  }
  .cart-count.visible { transform: scale(1); }

  /* ── HERO STRIP ────────────────────────────────── */
  .hero {
    padding: 60px 40px 40px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px;
  }
  .hero-eyebrow {
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--gold); font-weight: 500;
  }
  .hero-title {
    font-family: var(--ff-serif); font-size: clamp(38px, 6vw, 72px);
    font-weight: 300; line-height: 1.05;
    color: var(--text);
  }
  .hero-title em { font-style: italic; color: var(--gold-lt); }
  .hero-sub { color: var(--muted); font-size: 14px; margin-top: 8px; }

  /* ── TOOLBAR ───────────────────────────────────── */
  .toolbar {
    padding: 24px 40px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 68px; z-index: 90;
  }

  .search-wrap {
    position: relative; flex: 1; min-width: 200px; max-width: 360px;
  }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 15px; pointer-events: none;
  }
  .search-input {
    width: 100%; padding: 10px 14px 10px 40px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--ff-sans); font-size: 13px;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    outline: none;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.12); }

  .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }

  .chip {
    padding: 7px 16px; border-radius: 30px;
    border: 1px solid var(--border); background: none;
    color: var(--muted); cursor: pointer;
    font-family: var(--ff-sans); font-size: 12px; font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase;
    transition: all .2s var(--ease);
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--gold-lt); color: var(--gold-lt); }
  .chip.active { background: var(--gold); border-color: var(--gold); color: #0f0e0c; }

  .results-count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ── GRID ──────────────────────────────────────── */
  .grid-section { padding: 40px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 24px;
  }

  /* ── PRODUCT CARD ──────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
    animation: fadeUp .4s var(--ease) both;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(0,0,0,.45);
    border-color: rgba(201,168,76,.35);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-img {
    position: relative; height: 220px; overflow: hidden;
    background: var(--surface);
  }
  .card-img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .5s var(--ease);
  }
  .card:hover .card-img img { transform: scale(1.05); }

  .badge {
    position: absolute; top: 12px; left: 12px;
    padding: 4px 10px; border-radius: 4px;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
  }
  .badge-new  { background: var(--gold);  color: #0f0e0c; }
  .badge-sale { background: var(--danger); color: #fff; }
  .badge-hot  { background: #9b5ecf; color: #fff; }

  .card-body { padding: 18px; }

  .card-cat {
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--gold); font-weight: 500; margin-bottom: 6px;
  }
  .card-name {
    font-family: var(--ff-serif); font-size: 19px; font-weight: 400;
    color: var(--text); line-height: 1.25; margin-bottom: 4px;
  }
  .card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .card-footer { display: flex; align-items: center; justify-content: space-between; }

  .card-price { font-family: var(--ff-serif); font-size: 22px; font-weight: 600; color: var(--gold-lt); }
  .card-price-old { font-size: 13px; color: var(--muted); text-decoration: line-through; margin-left: 6px; }

  .card-stars { font-size: 11px; color: var(--gold); letter-spacing: 1px; }

  .add-btn {
    padding: 8px 16px; border-radius: var(--radius);
    background: var(--gold); border: none; color: #0f0e0c;
    font-family: var(--ff-sans); font-size: 11px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
    transition: background .2s var(--ease), transform .15s var(--ease);
  }
  .add-btn:hover { background: var(--gold-lt); }
  .add-btn:active { transform: scale(.95); }
  .add-btn.added { background: #2e7d32; color: #fff; }

  /* ── NO RESULTS ────────────────────────────────── */
  .no-results {
    grid-column: 1/-1; text-align: center; padding: 80px 20px;
    color: var(--muted);
  }
  .no-results .nr-icon { font-size: 48px; margin-bottom: 16px; }
  .no-results p { font-family: var(--ff-serif); font-size: 24px; font-weight: 300; }

  /* ── MODAL ─────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.75); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; width: 100%; max-width: 820px; max-height: 90vh;
    overflow-y: auto;
    display: grid; grid-template-columns: 1fr 1fr;
    transform: translateY(24px) scale(.97);
    transition: transform .3s var(--ease);
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-img {
    height: 100%; min-height: 360px;
    overflow: hidden; border-radius: 14px 0 0 14px;
    background: var(--surface);
  }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }

  .modal-body { padding: 40px 36px; display: flex; flex-direction: column; gap: 12px; }

  .modal-cat {
    font-size: 11px; letter-spacing: .25em; text-transform: uppercase;
    color: var(--gold); font-weight: 500;
  }
  .modal-title {
    font-family: var(--ff-serif); font-size: 32px; font-weight: 400; line-height: 1.15;
  }
  .modal-stars { color: var(--gold); font-size: 14px; }
  .modal-price-row { display: flex; align-items: baseline; gap: 10px; }
  .modal-price { font-family: var(--ff-serif); font-size: 30px; color: var(--gold-lt); font-weight: 600; }
  .modal-price-old { font-size: 16px; color: var(--muted); text-decoration: line-through; }
  .modal-desc { color: var(--muted); line-height: 1.7; font-size: 13.5px; flex: 1; }

  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--border); font-size: 11px; color: var(--muted);
  }

  .modal-actions { display: flex; gap: 12px; margin-top: auto; padding-top: 16px; }

  .btn-primary {
    flex: 1; padding: 13px 20px;
    background: var(--gold); border: none; color: #0f0e0c;
    font-family: var(--ff-sans); font-size: 13px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; border-radius: var(--radius);
    cursor: pointer; transition: background .2s var(--ease);
  }
  .btn-primary:hover { background: var(--gold-lt); }

  .btn-secondary {
    padding: 13px 20px; background: none;
    border: 1px solid var(--border); color: var(--text);
    font-family: var(--ff-sans); font-size: 13px; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase; border-radius: var(--radius);
    cursor: pointer; transition: border-color .2s var(--ease);
  }
  .btn-secondary:hover { border-color: var(--gold); }

  .modal-close {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .modal-close:hover { background: var(--border); }
  .modal-wrapper { position: relative; }

  /* ── CART DRAWER ───────────────────────────────── */
  .cart-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity .3s var(--ease);
  }
  .cart-overlay.open { opacity: 1; pointer-events: all; }

  .cart-drawer {
    position: fixed; top: 0; right: 0; z-index: 301;
    width: var(--cart-w); max-width: 100vw; height: 100vh;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .35s var(--ease);
  }
  .cart-overlay.open .cart-drawer { transform: translateX(0); }

  .cart-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .cart-title {
    font-family: var(--ff-serif); font-size: 26px; font-weight: 400;
  }
  .cart-title span { color: var(--gold); font-style: italic; }

  .drawer-close {
    background: none; border: none; color: var(--muted);
    font-size: 22px; cursor: pointer; line-height: 1;
    transition: color .2s;
  }
  .drawer-close:hover { color: var(--text); }

  .cart-items {
    flex: 1; overflow-y: auto; padding: 20px 28px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .cart-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    color: var(--muted); text-align: center; padding: 40px;
  }
  .cart-empty .ce-icon { font-size: 52px; opacity: .4; }
  .cart-empty p { font-family: var(--ff-serif); font-size: 22px; font-weight: 300; }
  .cart-empty small { font-size: 13px; }

  .cart-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--border);
    animation: fadeUp .3s var(--ease) both;
  }
  .ci-img {
    width: 70px; height: 70px; border-radius: 6px;
    object-fit: cover; flex-shrink: 0;
    background: var(--surface);
  }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-family: var(--ff-serif); font-size: 16px; font-weight: 400; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-cat { font-size: 11px; color: var(--gold); letter-spacing: .1em; text-transform: uppercase; }
  .ci-price { font-family: var(--ff-serif); font-size: 18px; color: var(--gold-lt); font-weight: 600; }
  .ci-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, background .15s;
  }
  .qty-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.1); }
  .qty-val { font-size: 14px; font-weight: 500; min-width: 20px; text-align: center; }

  .remove-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 2px 6px;
    transition: color .2s; border-radius: 4px;
  }
  .remove-btn:hover { color: var(--danger); background: rgba(192,82,58,.1); }

  .cart-footer {
    padding: 22px 28px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 14px;
  }
  .cart-totals { display: flex; flex-direction: column; gap: 6px; }
  .total-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .total-row.grand { font-family: var(--ff-serif); font-size: 22px; color: var(--text); font-weight: 400; padding-top: 8px; border-top: 1px solid var(--border); }
  .total-row.grand span:last-child { color: var(--gold-lt); }

  .checkout-btn {
    padding: 16px; background: var(--gold); border: none;
    color: #0f0e0c; font-family: var(--ff-sans); font-size: 13px;
    font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    border-radius: var(--radius); cursor: pointer;
    transition: background .2s var(--ease);
  }
  .checkout-btn:hover { background: var(--gold-lt); }

  /* ── TOAST ─────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 12px 22px; border-radius: 30px;
    font-size: 13px; z-index: 500;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease), transform .25s var(--ease);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-icon { color: var(--gold); font-size: 16px; }

  /* ── RESPONSIVE ────────────────────────────────── */
  @media (max-width: 680px) {
    header { padding: 0 18px; }
    .logo { font-size: 20px; }
    .hero { padding: 36px 18px 28px; }
    .toolbar { padding: 14px 18px; gap: 10px; }
    .grid-section { padding: 24px 18px; }
    .modal { grid-template-columns: 1fr; }
    .modal-img { min-height: 240px; border-radius: 14px 14px 0 0; }
    .modal-body { padding: 24px 22px; }
    --cart-w: 100vw;
  }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────── -->
<header>
  <div class="logo">Lumi<span>ère</span></div>
  <div class="header-right">
    <button class="cart-btn" onclick="openCart()">
      <span class="cart-icon">🛍</span>
      Cart
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ── HERO ────────────────────────────────────────── -->
<section class="hero">
  <p class="hero-eyebrow">New Collection · 2026</p>
  <h1 class="hero-title">Curated <em>Essentials</em><br>for the Discerning</h1>
  <p class="hero-sub">Premium goods, thoughtfully sourced.</p>
</section>

<!-- ── TOOLBAR ─────────────────────────────────────── -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="Search products…" oninput="applyFilters()" />
  </div>
  <div class="filter-chips" id="filterChips"></div>
  <span class="results-count" id="resultsCount"></span>
</div>

<!-- ── PRODUCT GRID ─────────────────────────────────── -->
<section class="grid-section">
  <div class="grid" id="productGrid"></div>
</section>

<!-- ── MODAL WRAPPER ────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-wrapper">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal" id="modal"></div>
  </div>
</div>

<!-- ── CART DRAWER ──────────────────────────────────── -->
<div class="cart-overlay" id="cartOverlay" onclick="handleCartOverlayClick(event)">
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2 class="cart-title">Your <span>Cart</span></h2>
      <button class="drawer-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-totals" id="cartTotals"></div>
      <button class="checkout-btn">Proceed to Checkout →</button>
    </div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────── -->
<div class="toast" id="toast">
  <span class="toast-icon">✦</span>
  <span id="toastMsg">Added to cart</span>
</div>

<script>
/* ── DATA ─────────────────────────────────────────── */
const PRODUCTS = [

  { id:2,  name:"Linen Overshirt",        cat:"Apparel",     price:118,  oldPrice:null, rating:4, badge:"new",
    desc:"100% pre-washed linen in sand dune. Relaxed silhouette with mother-of-pearl buttons and chest pocket.",
    tags:["linen","relaxed","handwash"],

  { id:3,  name:"Amber Pour Candle",      cat:"Home",        price:54,   oldPrice:null, rating:5, badge:"hot",
    desc:"300-hour burn time. Hand-poured soy wax with notes of sandalwood, amber and black pepper.",

    img:"https://images.unsplash.com/photo-1602535648012-ddf88b2c9fc6?w=600&q=80" },
  { id:4,  name:"Ceramic Mug Set",        cat:"Home",        price:76,   oldPrice:95,   rating:4, badge:"sale",

    tags:["stoneware","set-of-4","dishwasher"],

  { id:5,  name:"Noise-Cancelling Buds",  cat:"Electronics", price:189,  oldPrice:249,  rating:5, badge:"sale",
    desc:"Hybrid ANC with 32-hour battery life. Custom-tuned 11mm drivers deliver exceptional clarity across all frequencies.",

/* ── STATE ─────────────────────────────────────────── */
const CATS = ["All", ...new Set(PRODUCTS.map(p => p.cat))];
let activeCategory = "All";
let cart = JSON.parse(localStorage.getItem("lumiere_cart") || "[]");

/* ── INIT ──────────────────────────────────────────── */
function init() {
  renderChips();
  applyFilters();
  renderCart();
}

/* ── CHIPS ─────────────────────────────────────────── */
function renderChips() {
  const wrap = document.getElementById("filterChips");
  wrap.innerHTML = CATS.map(c =>
    `<button class="chip ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`
  ).join("");
}

function setCategory(cat) {
  activeCategory = cat;
  renderChips();
  applyFilters();
}

/* ── FILTER + RENDER GRID ──────────────────────────── */
function applyFilters() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const filtered = PRODUCTS.filter(p => {
    const catOk = activeCategory === "All" || p.cat === activeCategory;
    const searchOk = !q || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q);
    return catOk && searchOk;
  });
  document.getElementById("resultsCount").textContent = `${filtered.length} product${filtered.length !== 1 ? "s" : ""}`;
  renderGrid(filtered);
}

function stars(n) {
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function renderGrid(products) {
  const grid = document.getElementById("productGrid");
  if (!products.length) {
    grid.innerHTML = `<div class="no-results"><div class="nr-icon">✦</div><p>No products found</p></div>`;
    return;
  }
  grid.innerHTML = products.map((p, i) => {
    const inCart = cart.find(c => c.id === p.id);
    return `
    <div class="card" style="animation-delay:${i * 0.04}s" onclick="openModal(${p.id})">
      <div class="card-img">
        <img src="${p.img}" alt="${p.name}" loading="lazy" />
        ${p.badge ? `<span class="badge badge-${p.badge}">${p.badge}</span>` : ""}
      </div>
      <div class="card-body">
        <div class="card-cat">${p.cat}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-footer">
          <div>
            <span class="card-price">$${p.price}</span>
            ${p.oldPrice ? `<span class="card-price-old">$${p.oldPrice}</span>` : ""}
            <br/><span class="card-stars">${stars(p.rating)}</span>
          </div>
          <button class="add-btn ${inCart ? 'added' : ''}"
            onclick="event.stopPropagation(); addToCart(${p.id}, this)"
          >${inCart ? "✓ Added" : "+ Cart"}</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ── MODAL ─────────────────────────────────────────── */
function openModal(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const inCart = cart.find(c => c.id === p.id);
  document.getElementById("modal").innerHTML = `
    <div class="modal-img"><img src="${p.img}" alt="${p.name}" /></div>
    <div class="modal-body">
      <div class="modal-cat">${p.cat}</div>
      <h2 class="modal-title">${p.name}</h2>
      <div class="modal-stars">${stars(p.rating)} <span style="color:var(--muted);font-size:12px;font-family:var(--ff-sans);">(${p.rating}.0)</span></div>
      <div class="modal-price-row">
        <span class="modal-price">$${p.price}</span>
        ${p.oldPrice ? `<span class="modal-price-old">$${p.oldPrice}</span>` : ""}
        ${p.oldPrice ? `<span style="color:var(--gold);font-size:12px;font-weight:600;">−${Math.round((1-p.price/p.oldPrice)*100)}% off</span>` : ""}
      </div>
      <p class="modal-desc">${p.desc}</p>
      <div class="modal-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <div class="modal-actions">
        <button class="btn-primary" id="modalAddBtn" onclick="addToCartFromModal(${p.id})">
          ${inCart ? "✓ In Cart" : "Add to Cart"}
        </button>
        <button class="btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  `;
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById("modalOverlay")) closeModal();
}

function addToCartFromModal(id) {
  addToCart(id, null);
  const btn = document.getElementById("modalAddBtn");
  if (btn) { btn.textContent = "✓ In Cart"; }
}

/* ── CART LOGIC ─────────────────────────────────────── */
function saveCart() {
  localStorage.setItem("lumiere_cart", JSON.stringify(cart));
}

function addToCart(id, btn) {
  const existing = cart.find(c => c.id === id);
  if (existing) {
    existing.qty++;
  } else {
    const p = PRODUCTS.find(x => x.id === id);
    cart.push({ id: p.id, name: p.name, cat: p.cat, price: p.price, img: p.img, qty: 1 });
  }
  saveCart();
  updateCartCount();
  renderCart();
  if (btn) { btn.textContent = "✓ Added"; btn.classList.add("added"); }
  showToast("Added to cart");
  // refresh grid buttons
  applyFilters();
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  updateCartCount();
  renderCart();
  applyFilters();
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) return removeFromCart(id);
  saveCart();
  renderCart();
}

function updateCartCount() {
  const total = cart.reduce((a, c) => a + c.qty, 0);
  const el = document.getElementById("cartCount");
  el.textContent = total;
  el.classList.toggle("visible", total > 0);
}

function renderCart() {
  const wrap = document.getElementById("cartItems");
  const footer = document.getElementById("cartFooter");
  const totals = document.getElementById("cartTotals");
  if (!cart.length) {
    wrap.innerHTML = `<div class="cart-empty">
      <div class="ce-icon">🛍</div>
      <p>Your cart is empty</p>
      <small>Add some products to get started</small>
    </div>`;
    footer.style.display = "none";
    return;
  }
  wrap.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img class="ci-img" src="${item.img}" alt="${item.name}" />
      <div class="ci-info">
        <div class="ci-cat">${item.cat}</div>
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">$${(item.price * item.qty).toFixed(2)}</div>
      </div>
      <div class="ci-right">
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${item.id})">✕ Remove</button>
      </div>
    </div>
  `).join("");

  const subtotal = cart.reduce((a, c) => a + c.price * c.qty, 0);
  const shipping = subtotal > 200 ? 0 : 12;
  const total = subtotal + shipping;
  totals.innerHTML = `
    <div class="total-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
    <div class="total-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--gold)">Free</span>' : '$'+shipping.toFixed(2)}</span></div>
    <div class="total-row grand"><span>Total</span><span>$${total.toFixed(2)}</span></div>
  `;
  footer.style.display = "flex";
  updateCartCount();
}

/* ── CART DRAWER ─────────────────────────────────────── */
function openCart() {
  document.getElementById("cartOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeCart() {
  document.getElementById("cartOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function handleCartOverlayClick(e) {
  if (e.target === document.getElementById("cartOverlay")) closeCart();
}

/* ── TOAST ───────────────────────────────────────────── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ── KEYBOARD ────────────────────────────────────────── */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); closeCart(); }
});

/* ── START ───────────────────────────────────────────── */
init();
updateCartCount();
</script>
</body>
</html>
